main{padding:28px 32px 50px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:24px}.top h1{margin:0;color:var(--n)}.top p{margin:5px 0;color:var(--m)}
.view{display:none}.view.active{display:block}.grid{display:grid;gap:16px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
.card{background:white;border:1px solid var(--l);border-radius:17px;padding:19px;box-shadow:0 10px 28px #17365d12}.metric strong{display:block;font-size:29px;color:var(--n)}.metric span{color:var(--m);font-size:13px}
.sec{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:26px 0 11px}.sec h2{margin:0;color:var(--n);font-size:20px}.sec p{margin:3px 0 0;color:var(--m);font-size:13px}
.primary,.secondary,.danger{border-radius:11px;padding:10px 13px;font-weight:750}.primary{border:0;background:var(--b);color:white}.secondary{border:1px solid var(--l);background:white;color:var(--n)}.danger{border:1px solid #ffd0d5;background:#fff2f3;color:var(--r)}

.priority{border-left:5px solid var(--t)}.activity{border-left:5px solid var(--b)}.activity.ind{border-left-color:var(--t)}.activity.hob{border-left-color:var(--b)}.activity.bide{border-left-color:var(--p)}.activity.abe{border-left-color:var(--w)}.activity h3,.priority h3{color:var(--n);margin:6px 0}.small{font-size:12px;color:var(--m)}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}

.modal{position:fixed;inset:0;background:#11182780;display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal.open{display:flex}.box{background:white;width:min(1030px,100%);max-height:92vh;overflow:auto;border-radius:18px}.mhead{position:sticky;top:0;background:white;padding:16px 20px;border-bottom:1px solid var(--l);display:flex;justify-content:space-between;z-index:2}.mbody{padding:20px}.steps{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:17px}.step{padding:7px 9px;border-radius:999px;background:#edf1f5;color:var(--m);font-size:11px;font-weight:800}.step.active{background:var(--n);color:white}
.actions{display:flex;justify-content:space-between;gap:10px;margin-top:18px}.copy{position:relative;white-space:pre-wrap;background:#f7f9fb;border:1px solid var(--l);border-radius:11px;padding:13px 90px 13px 13px;min-height:52px}.copy button{position:absolute;right:8px;top:8px}

.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.tabs button.active{background:var(--n);color:white}.guideSteps{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.guideSteps div{border:1px solid var(--l);background:#f8fafb;border-radius:12px;padding:13px}.guideSteps b{color:var(--n)}

<style id="v36-year-style">
:root{
  --n:#355a73;
  --b:#6fa8c8;
  --t:#70b7ad;
  --bg:#f7fbfc;

  --m:#697783;
  --l:#dfe8ed;
  --ok:#2f855a;
  --w:#b7791f;
  --r:#b23a48;

  --paper:#ffffff;

body{font-family:"Century Gothic","Aptos","Segoe UI",Arial,sans-serif;background:linear-gradient(180deg,#fbfdfe,#f4f9fa);color:var(--ink)}
.app{grid-template-columns:270px 1fr}
aside{background:linear-gradient(180deg,#ffffff,#edf7f8);color:var(--n);border-right:1px solid var(--l);box-shadow:8px 0 26px rgba(53,90,115,.08)}
.brand{color:var(--n);letter-spacing:-.02em}.brand small{color:#6c8090;opacity:1}
#brandSub,.ej,.creditSmall,aside .small{color:#6c8090!important}
aside .logic{background:#ffffff;border:1px solid var(--l);color:#52616b;box-shadow:0 8px 18px rgba(53,90,115,.06)}
.officialLogo{background:#fff;border:1px solid var(--l);box-shadow:none}
.nav button{color:#4f6473;background:transparent}
.nav button.active,.nav button:hover{background:#dff2f3;color:var(--n)}
.top h1,.sec h2,.metric strong,.activity h3,.priority h3,label{color:var(--n)}
.card,details.ac,.box{background:#fff;border:1px solid var(--l);box-shadow:0 10px 28px rgba(53,90,115,.08)}
.primary{background:linear-gradient(135deg,#6fa8c8,#70b7ad);color:#fff;border:0}
.secondary{background:#fff;color:var(--n);border:1px solid var(--l)}
.secondary.active,.tabs button.active,.termBtn.active{background:#dff2f3;color:var(--n);border-color:#b8dadd}
.pill{background:#edf7f8;color:var(--n)}.teal{background:#e4f4f2;color:#347a72}.purple{background:#f1effb;color:#6558a7}
.progress span{background:linear-gradient(90deg,#70b7ad,#6fa8c8)}
.callout{background:#eef8f8;border:1px solid #cde7e8;color:#42616a}
.step.active{background:#6fa8c8;color:#fff}
.tbl th{background:#f1f8f9;color:var(--n)}
.slotCard{background:#fbfdfe;border-left-color:#6fa8c8}
.slotCard.ind{background:#eaf7f7;border-left-color:#70b7ad}.slotCard.bide{background:#f3f0fb;border-left-color:#8172c6}.slotCard.abe{background:#fff7e8;border-left-color:#d59b36}
.termTools{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.termBtn{border:1px solid var(--l);background:#fff;color:var(--n);border-radius:999px;padding:8px 12px;font-weight:800;font-size:12px}
.termBlock{margin:18px 0;border:1px solid var(--l);border-radius:16px;overflow:hidden;background:#fff}
.termBlock h3{margin:0;padding:13px 16px;background:#f1f8f9;color:var(--n)}
.termBlock .inside{border-top:0}
.termKpis{display:grid;grid-template-columns:repeat(4,minmax(120px,1fr));gap:10px;margin:0 0 14px}
.termKpis .miniKpi{background:#fff;border:1px solid var(--l);border-radius:14px;padding:12px}
.termKpis .miniKpi b{display:block;font-size:20px;color:var(--n)}
.termKpis .miniKpi span{font-size:12px;color:var(--m)}
.indicatorGuide,.followGuide{background:#f7fbfc;border:1px solid var(--l);border-left:5px solid var(--t);border-radius:14px;padding:12px;margin:0 0 14px;color:var(--ink)}
.indicatorGuide b,.followGuide b{color:var(--n)}
#topTools{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
#topTools label{margin:0}
@media(max-width:950px){.app{grid-template-columns:1fr}.termKpis{grid-template-columns:repeat(2,1fr)}}
@media(max-width:650px){.termKpis{grid-template-columns:1fr}}
</style>

.mutedRow{opacity:.58}.checkGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.checkItem{border:1px solid var(--l);border-radius:13px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;background:#fff}.checkItem.okay{border-left:5px solid var(--ok);background:#f7fcf9}.checkItem.nope{border-left:5px solid var(--w);background:#fffaf0}.checkItem .mark{font-weight:900;font-size:18px;line-height:1}.checkItem b{display:block;color:var(--n)}
.v40TrackCard{display:grid;gap:10px}.v40TrackCard .trackHead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.v40TrackCard .trackGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.v40TrackCard .progressBox{padding:11px;border:1px solid var(--l);border-radius:12px;background:#fbfdfe}.v40TrackCard textarea{min-height:72px}
.v40OfficialTerm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#f4fafb;border:1px solid var(--l);border-radius:13px;padding:10px 12px;margin-bottom:14px}.v40OfficialTerm select{width:auto;min-width:190px}
.v40CatalogHero{background:linear-gradient(135deg,#e9f7f5,#eef6fb);border:1px solid #cfe3e7;border-radius:15px;padding:14px 16px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:12px}.v40CatalogHero b{color:var(--n)}
@media(max-width:1100px){.g5{grid-template-columns:repeat(3,1fr)}.teacherKpis{grid-template-columns:repeat(2,1fr)}}

    }

    if(s===4)return `<div class="officialNote"><strong>Aplikazio ofizialerako kopiatzeko eremuak.</strong> Lorpen-adierazleak 3 dira eta jardueraren lehentasun/helburuekin lerrokatuta sortu dira.</div>`+Object.entries(officialText(D)).map(([k,v],i)=>`<label>${E(k)}</label><div class="copy" id="cpw${i}">${E(v)}<button class="secondary" onclick="copyText('cpw${i}')">Kopiatu</button></div>`).join('');
  };

  window.cap=cap;
  const oldChecklist=checklist;
  checklist=function(){const rows=oldChecklist().filter(r=>!r.t.includes('adierazle')&&!r.t.includes('indicadores'));rows.push({t:'Jarduera guztiek helburu espezifikoak hautatuta dituzte',ok:S.activities.every(a=>(a.objectives||[]).length>0)});rows.push({t:'Jarduera guztiek zehazki 3 lorpen-adierazle dituzte',ok:S.activities.every(a=>(a.ach||[]).filter(Boolean).length===3)});rows.push({t:'Lorpen-adierazleak lehentasunekin eta helburuekin lerrokatuta berrikusita daude',ok:S.activities.every(a=>(a.objectives||[]).length>0&&(a.ach||[]).filter(Boolean).length===3)});return rows;};
  window.checklist=checklist;
  const oldOfficial=officialText;
  officialText=function(a){buildThreeIndicators(a);const obj=oldOfficial(a);obj['Lorpen-adierazleak / Indicadores de logro']=(a.ach||[]).slice(0,3).join('\n');if(obj['Ebidentzia']) delete obj['Ebidentzia'];if(obj['Evidencia / Ebidentzia']) delete obj['Evidencia / Ebidentzia'];return obj;};
  window.officialText=officialText;
  ensureThreeAll(!S._v30IndicatorsReviewed);
  S._v30IndicatorsReviewed=true;

<script id="v32-save-step4-fix">
(function(){
  function val(id){
    const el=document.getElementById(id);
    return el ? el.value : undefined;
  }
  function captureAllVisible(){
    if(!D || !D.id) return;
    const vPriority=val("wPriority"); if(vPriority!==undefined) D.priority=vPriority;
    const vMeasure=val("wMeasure"); if(vMeasure!==undefined) D.measure=vMeasure;
    const vTerm=val("wTerm"); if(vTerm!==undefined) D.term=vTerm;
    const vEco=val("wEco"); if(vEco!==undefined) D.ecosystem=vEco;
    const vNeed=val("wNeed"); if(vNeed!==undefined) D.need=vNeed;
    const vChange=val("wChange"); if(vChange!==undefined) D.change=vChange;

    const vName=val("wName"); if(vName!==undefined) D.name=vName;
    const vSub=val("wSub"); if(vSub!==undefined) D.sub=vSub;
    const vDesc=val("wDesc"); if(vDesc!==undefined) D.desc=vDesc;
    const vTeacher=val("wTeacher"); if(vTeacher!==undefined) D.teacher=vTeacher;
    const vLevel=val("wLevel"); if(vLevel!==undefined) D.level=vLevel;
    const vHours=val("wHours"); if(vHours!==undefined) D.hours=+vHours||0;
    const vStudents=val("wStudents"); if(vStudents!==undefined) D.students=+vStudents||0;
    const vSlot=val("wSlot"); if(vSlot!==undefined) D.slot=vSlot;
    const vSlot2=val("wSlot2"); if(vSlot2!==undefined) D.slot2=vSlot2;

    const goalBoxes=[...document.querySelectorAll("[data-goal]:checked")];
    if(goalBoxes.length) D.objectives=goalBoxes.map(el=>+el.dataset.goal).slice(0,3);

    const achFields=[0,1,2].map(i=>val("wAch"+i)).filter(v=>v!==undefined);
    if(achFields.length) D.ach=achFields.map(v=>String(v||"").trim()).filter(Boolean).slice(0,3);

    if(!D.objectives || !D.objectives.length){
      try{ if(typeof buildThreeIndicators==="function") buildThreeIndicators(D); }catch(e){}
    }
    if(!D.ach || D.ach.filter(Boolean).length!==3){
      try{ if(typeof buildThreeIndicators==="function") buildThreeIndicators(D); }catch(e){}
    }
    if(D.follow) delete D.follow;
  }

  saveDraft=function(closeAfter=false){
    captureAllVisible();
    if(!D || !D.id){ alert("Ez da jarduerarik aukeratu."); return; }
    if(!D.name || !String(D.name).trim()) D.name="Jarduera berria";
    if(!Array.isArray(S.activities)) S.activities=[];
    const i=S.activities.findIndex(a=>a.id===D.id);
    const copy=JSON.parse(JSON.stringify(D));
    if(i>=0) S.activities[i]=copy;
    else S.activities.push(copy);
    if(typeof saveSoft==="function") saveSoft();
    else localStorage.setItem("heziV32_itsasargi_eredu_errealista", JSON.stringify(S));
    render();
    if(closeAfter) closeW();
    else alert("Jarduera gorde da.");
  };
  window.saveDraft=saveDraft;

  nextS=function(){
    captureAllVisible();
    if(step<4){ step++; drawW(); }
    else { saveDraft(true); }
  };
  prevS=function(){
    captureAllVisible();
    if(step){ step--; drawW(); }
  };
  window.nextS=nextS;
  window.prevS=prevS;

  const _drawW32=drawW;
  drawW=function(){
    _drawW32();
    const draft=document.getElementById("draftBtn");
    const next=document.getElementById("next");
    const prev=document.getElementById("prev");
    if(draft){
      draft.textContent = step>=3 ? "Jarduera gorde" : "Zirriborroa gorde";
      draft.onclick = function(){ saveDraft(step>=3); };
    }
    if(next){
      next.textContent = step>=4 ? "Jarduera gorde eta itxi" : "Hurrengoa →";
      next.onclick = nextS;
    }
    if(prev){ prev.onclick = prevS; }
    if(step===3 && document.getElementById("content") && !document.getElementById("step4SaveHint")){
      const hint=document.createElement("div");
      hint.id="step4SaveHint";
      hint.className="callout";
      hint.style.marginTop="12px";
      hint.innerHTML="<strong>4. pausoan ere gorde daiteke.</strong> Sakatu ‘Jarduera gorde’ eta jarduera zerrendan eguneratuta geratuko da. Bestela, ‘Hurrengoa’ sakatu eta 5. pausoan aplikazio ofizialerako testua ikusiko duzu.";
      document.getElementById("content").appendChild(hint);
    }
  };
  window.drawW=drawW;

  const _openWizard32=openWizard;
  openWizard=function(id=null,fs=null){
    _openWizard32(id,fs);
    drawW();
  };
  window.openWizard=openWizard;

  render();
})();
</script>


<script id="v36-ikasturteko-jarraipena">
(function(){
  const LOADS_FINAL=["1/3","1/2","2/3","5/6","1"];
  const TERM_KEYS=["all","1","2","3"];
  const TERM_NAMES={all:"Ikasturte osoa","1":"1. hiruhilekoa","2":"2. hiruhilekoa","3":"3. hiruhilekoa"};
  const WEEKS={ "1":10, "2":10, "3":10, "all":30 };
  function esc(s){return E(s==null?"":String(s));}
  function num(v){const n=Number(String(v??"").replace("%","").replace(",","."));return isFinite(n)?n:0;}
  function pctText(v){let n=num(v); if(n>0 && n<=1)n=n*100; return Math.round(n)+"%";}
  function filterTerm(a,t){return !t||t==="all"||a.term===t||a.term==="all";}
  function actsByTerm(t){return (S.activities||[]).filter(a=>filterTerm(a,t));}
  function termButtons(kind){
    const val=S[kind]||"all";
    return `<div class="termTools">${TERM_KEYS.map(k=>`<button class="termBtn ${val===k?"active":""}" onclick="setTermView('${kind}','${k}')">${TERM_NAMES[k]}</button>`).join("")}</div>`;
  }
  window.setTermView=function(kind,val){S[kind]=val;saveSoft();render();};
  function termLabel2(t){return TERM_NAMES[t]||termLabel(t);}
  function plannedTerm(t,measure){return actsByTerm(t).filter(a=>!measure||a.measure===measure).reduce((x,a)=>x+(+a.hours||0),0);}
  function avgAttendance(acts){
    const vals=acts.map(a=>num(a.att)).filter(v=>v>0);
    return vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/vals.length):0;
  }
  function avgExecution(acts){
    const vals=acts.map(a=>{
      if(a.followup && num(a.followup.executionPct)>0) return num(a.followup.executionPct);
      const planned=(+a.plannedSessions||Math.max(1,Math.round((+a.hours||1)*(WEEKS[a.term||"1"]||10))));
      return planned?((+a.done||0)/planned*100):0;
    }).filter(v=>v>0);
    return vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/vals.length):0;
  }
  function termKpis(t){
    const acts=actsByTerm(t);
    return `<div class="termKpis">
      <div class="miniKpi"><b>${acts.length}</b><span>Jarduera</span></div>
      <div class="miniKpi"><b>${plannedTerm(t)} h</b><span>Ordu/aste</span></div>
      <div class="miniKpi"><b>${avgExecution(acts)}%</b><span>Gauzatzea</span></div>
      <div class="miniKpi"><b>${avgAttendance(acts)}%</b><span>Asistentzia</span></div>
    </div>`;
  }

  // Brand and Basque-only clean wording.
  TR.eu.brandSmall="plangintza tresna";
  TR.eu.brandSub="Plangintza, jarraipena eta memoria";
  TR.eu.logic="<strong>Lan-fluxua</strong><br>BEHARRA → JARDUERA → ADIERAZLEA → JARRAIPENA<br><hr style=\"border:0;border-top:1px solid #dbe3ea;margin:10px 0\"><small>HeziLabek egina Hezi+ proiekturako<br>CC BY-NC-SA 4.0</small>";
  TR.eu.title.center=["Hezi+ plangintza tresna","Ikasturte osoko plangintza eta jarraipena."];
  TR.eu.title.schedule=["Ordutegia","Hiruhilekoka edo ikasturte osoan ikus daiteke."];
  TR.eu.title.track=["Jarraipena","Excel bidez jasotako gauzatzea eta asistentzia."];
  TR.eu.title.summary=["Laburpena","Hiruhilekoka bereizitako ikuspegia."];
  TR.eu.tabs={official:"Aplikazio ofizialerako datuak",activities:"Jardueren laburpena",teachers:"Irakasleak",checklist:"Kontrol-zerrenda",followup:"Jarraipena"};
  if(TR.eu.nav.home) delete TR.eu.nav.home;
  S.lang="eu";
  if(!S.view || S.view==="home") S.view="center";
  S.scheduleTerm=S.scheduleTerm||"all";
  S.summaryTerm=S.summaryTerm||"all";
  S.trackTerm=S.trackTerm||"all";
  S.followup=S.followup||{};

  function addTopTools(){
    const top=document.querySelector(".top .row");
    if(!top || document.getElementById("topTools")) return;
    top.insertAdjacentHTML("afterbegin",`
      <div id="topTools">
        <button class="secondary" onclick="downloadFollowupWorkbook()">Jarraipen Excel eredua</button>
        <label class="secondary">Jarraipen Excel kargatu<input id="followFile" type="file" accept=".xlsx,.xls,.csv,.txt" style="display:none"></label>
      </div>`);
    document.getElementById("followFile").addEventListener("change",function(e){
      const f=e.target.files && e.target.files[0]; if(f) importFollowupWorkbook(f);
      e.target.value="";
    });
  }

  // Teacher load dropdown.
  function loadOptions(v){
    return LOADS_FINAL.map(x=>`<option value="${x}" ${String(v||"1")===x?"selected":""}>${x}</option>`).join("");
  }
  function beautifyTeacherLoads(){
    document.querySelectorAll("#teachers tbody tr").forEach((tr,i)=>{
      const cell=tr.children && tr.children[3];
      if(cell) cell.innerHTML=`<select onchange="teach(${i},'load',this.value)">${loadOptions(S.teachers[i]?.load||"1")}</select>`;
    });
  }
  const _renderCenter36=renderCenter;
  renderCenter=function(){_renderCenter36(); beautifyTeacherLoads();};
  window.renderCenter=renderCenter;

  // Short and measurable achievement indicators.
  function tx(a){return String([(a&&a.name)||"", (a&&a.measure)||"", (a&&a.ecosystem)||"", (a&&a.need)||"", (a&&a.change)||"", (a&&a.desc)||""].join(" ")).toLowerCase();}
  function inferShortGoals(a){
    const t=tx(a);
    if(t.includes("euskara")) return [6,3,2];
    if(/irakur|testu|informazio|komunikazio|irratia|podcast/.test(t)) return [0,2,7];
    if(/matemat|steam|datu|grafiko|laborategi|velutina|prototipo/.test(t)) return [0,1,7];
    if(/famil|komunitate|parte|udal|kultura|auzo/.test(t)) return [3,2,6];
    if(/bizikidetza|lagun|ongizate|zaintza|harrera/.test(t)) return [4,3,7];
    return [2,3,0];
  }
  function mainAction(a){
    const t=tx(a);
    if(t.includes("euskara")) return "euskarazko ahozko jardun egokia egiten du";
    if(/irakur|testu|informazio|irratia|podcast/.test(t)) return "informazio nagusia identifikatu eta azaltzen du";
    if(/matemat|problema/.test(t)) return "problema baten estrategia arrazoitzen du";
    if(/datu|grafiko|velutina/.test(t)) return "datuetatik ondorio egokia ateratzen du";
    if(/steam|prototipo|laborategi/.test(t)) return "prototipo edo proba bat justifikatzen du";
    if(/famil|katalogo/.test(t)) return "familiei zuzendutako mezua argi azaltzen du";
    if(/udal|komunitate|auzo|kultura/.test(t)) return "komunitaterako proposamen bat egiten du";
    if(/bizikidetza|ongizate|zaintza|harrera|lagun/.test(t)) return "talde-lanerako edo zaintzarako estrategia bat erabiltzen du";
    if(/autonomia|agenda|ikasteko ohitura/.test(t)) return "ikasteko estrategia bat erabiltzen du";
    return "hautatutako helburuan aurrerapena erakusten du";
  }
  function product(a){
    const t=tx(a);
    if(/irratia|podcast/.test(t)) return "gidoia edo grabazioa";
    if(/irakur|testu|informazio/.test(t)) return "ulermen-fitxa";
    if(t.includes("euskara")) return "ahozko ekoizpena";
    if(/matemat|problema/.test(t)) return "ebazpen-fitxa";
    if(/velutina|datu|grafiko/.test(t)) return "datu-fitxa";
    if(/steam|prototipo|laborategi/.test(t)) return "prototipo-fitxa";
    if(/famil|katalogo/.test(t)) return "familientzako testua";
    if(/udal|komunitate|auzo|kultura/.test(t)) return "proposamen laburra";
    if(/bizikidetza|harrera|lagun|ongizate/.test(t)) return "autoebaluazio-fitxa";
    return "azken ekoizpena";
  }function transfer(a){
    const t=tx(a);
    if(t.includes("euskara")) return "beste ahozko egoera batean";
    if(/irakur|testu|informazio|irratia|podcast/.test(t)) return "beste testu/komunikazio-egoera batean";
    if(/matemat|datu|steam|laborategi|prototipo|velutina/.test(t)) return "erronka berri batean";
    if(/famil|komunitate|udal|auzo|kultura/.test(t)) return "komunitateari aurkeztean";
    if(/bizikidetza|ongizate|zaintza|harrera|lagun/.test(t)) return "eguneroko harremanetan";
    return "beste ikaskuntza-egoera batean";
  }
  function makeShortIndicators(a){
    if(!a.objectives || !a.objectives.length) a.objectives=inferShortGoals(a);
    a.objectives=a.objectives.slice(0,3);
    while(a.objectives.length<3){
      const base=inferShortGoals(a), c=base[a.objectives.length] ?? a.objectives.length;
      a.objectives.push(a.objectives.includes(c)?(c+1)%goals().length:c);
    }
    const level=a.level||"DBH";
    a.ach=[
      "%75ek "+mainAction(a)+" ("+level+"; errubrika 3/4).",
      "%70ek "+product(a)+" osatzen du (3 irizpide beteta).",
      "%80k ikasitakoa "+transfer(a)+" aplikatzen du (behaketa/autoebaluazioa)."
    ];
    if(a.follow) delete a.follow;
    return a;
  }

  window.downloadFollowupWorkbook=function(){

      for(let s=1;s<=sess;s++){
        saioRows.push([a.id,a.name,a.measure,termLabel(a.term),s,"","",a.students||0,"",["","Number",`=IF(RC[-2]=0,0,RC[-1]/RC[-2])`],""]);
        rnum++;

    const jardRows=[["ID","Jarduera","Neurria","Hiruhilekoa","Arduraduna","Orduak/aste","Maila","Ikasleak","Ekosistema"],...activities.map(a=>[a.id,a.name,a.measure,termLabel(a.term),a.teacher,a.hours,a.level,a.students,a.ecosystem||""])];

    const sheets=[["Argibideak",infoRows],["Jarduerak",jardRows],["Saioak",saioRows],["Laburpena",labRows]];
    let xml='<?xml version="1.0" encoding="UTF-8"?><?mso-application progid="Excel.Sheet"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">';
    sheets.forEach(sh=>{xml+=`<Worksheet ss:Name="${safeSheet(sh[0])}"><Table>`+sh[1].map(row).join("")+"</Table></Worksheet>";});

  function loadXlsx(cb){
    if(window.XLSX) return cb();

    s.onload=cb;

    document.head.appendChild(s);
  }
  function parseCSV(text){
    const lines=text.split(/\r?\n/).filter(x=>x.trim());
    const parseLine=l=>{let out=[],cur="",q=false;for(let i=0;i<l.length;i++){const c=l[i];if(c==='"'&&l[i+1]==='"'){cur+='"';i++;}else if(c==='"'){q=!q;}else if((c===","||c===";")&&!q){out.push(cur);cur="";}else cur+=c;}out.push(cur);return out;};
    const head=parseLine(lines.shift()).map(x=>x.trim());
    return lines.map(l=>{const vals=parseLine(l),o={};head.forEach((h,i)=>o[h]=vals[i]??"");return o;});
  }
  function valOf(row,names){for(const n of names){if(row[n]!=null && row[n]!=="") return row[n];}return "";}
  function applySessionRows(rows){
    const acc={};
    rows.forEach(r=>{
      const id=String(valOf(r,["ID","Id","id","Jarduera ID"])).trim();
      const name=String(valOf(r,["Jarduera","Jardueraren izena","Izena"])).trim();
      if(!id && !name) return;
      const key=id||name;
      if(!acc[key]) acc[key]={id,name,planned:0,done:0,enrolledSum:0,attSum:0,attBase:0,notes:[]};
      const a=acc[key]; a.planned++;
      const status=String(valOf(r,["Gauzatuta","Eginda","Egoera"])).toLowerCase();
      const enrolled=num(valOf(r,["Matrikulatuak","Ikasleak"]));
      const att=num(valOf(r,["Bertaratuak","Asistentzia kopurua"]));
      if(status==="bai"||status==="✓"||status==="x"||status==="eginda"){a.done++; a.attSum+=att; a.attBase+=enrolled;}
      const notes=String(valOf(r,["Oharrak","Oharra"])).trim(); if(notes) a.notes.push(notes);
    });
    return Object.values(acc).map(a=>({ID:a.id,Jarduera:a.name,"Aurreikusitako saioak":a.planned,"Egindako saioak":a.done,"Gauzatzea %":a.planned?Math.round(a.done/a.planned*100):0,"Asistentzia %":a.attBase?Math.round(a.attSum/a.attBase*100):0,Oharrak:a.notes.slice(0,3).join(" | ")}));
  }
  function applyFollowRows(rows){
    let matched=0;
    rows.forEach(r=>{
      const id=String(valOf(r,["ID","Id","id","Jarduera ID"])).trim();
      const name=String(valOf(r,["Jarduera","Jardueraren izena","Izena"])).trim();
      const a=(S.activities||[]).find(x=>String(x.id)===id) || (S.activities||[]).find(x=>String(x.name).trim()===name);
      if(!a) return;
      const planned=num(valOf(r,["Aurreikusitako saioak","Planifikatutako saioak"]));
      const done=num(valOf(r,["Egindako saioak","Saio eginak"]));
      let exec=num(valOf(r,["Gauzatzea %","Gauzatze %","Egite %"]));
      let att=num(valOf(r,["Asistentzia %","Batez besteko asistentzia","Asistentzia"]));
      if(exec>0 && exec<=1)exec*=100; if(att>0 && att<=1)att*=100;
      const notes=String(valOf(r,["Oharrak","Oharra","Jarraipen oharrak"])).trim();
      a.plannedSessions=planned||a.plannedSessions||0;
      a.done=done||a.done||0;
      a.att=Math.round(att||a.att||0);
      a.followup={plannedSessions:planned||0,doneSessions:done||0,executionPct:Math.round(exec||0),attendancePct:Math.round(att||0),notes};

  window.importFollowupWorkbook=function(file){

    loadXlsx(function(){

  // Checklist and official copy cleaned.
  checklist=function(){

      {t:`Parte-hartzea %50erantz (${Math.min(part,centerTotal())}/${Math.ceil(centerTotal()/2)})`,ok:part>=Math.ceil(centerTotal()/2)}
    ];

  officialText=function(a){

    return {
      "Jardueraren izena":a.name||"",

      "Neurria":a.measure||"",
      "Azpitipologia":a.sub||"",
      "Hiruhilekoa":termLabel(a.term),
      "Ekosistema":a.ecosystem||"",
      "Helburuekiko lotura":(typeof objText==="function") ? objText(a.objectives||[]) : (a.objectives||[]).map(i=>goals()[i]).join("\\n"),
      "Hobekuntza-ekintzekiko lotura":"Lehentasuna: "+(p?.title||"")+"\nBeharra: "+(a.need||"")+"\nEspero den aldaketa: "+(a.change||""),
      "Ikasle hartzaileak":(a.level||"")+" · "+(a.students||0)+" ikasle",
      "Saioen antolaketa":(a.hours||0)+" h/aste · "+slotName(a.slot)+(a.slot2?" · "+slotName(a.slot2):""),
      "Lorpen-adierazleak":(a.ach||[]).slice(0,3).join("\n")
    };
  };
  window.officialText=officialText;

  renderSummary=function(){
    summaryH2.textContent="Laburpena";
    summaryP.textContent="Aukeratu ikuspegia eta hiruhilekoa.";
    let tabs=TR.eu.tabs;
    summaryTabs.innerHTML=Object.entries(tabs).map(([k,v])=>`<button class="secondary ${S.summaryMode===k?"active":""}" onclick="S.summaryMode='${k}';saveSoft();renderSummary()">${v}</button>`).join("")+`<button class="secondary" onclick="window.print()">Inprimatu</button>`;
    const t=S.summaryTerm||"all", acts=actsByTerm(t);
    let html=termButtons("summaryTerm")+termKpis(t);
    if(S.summaryMode==="official"){
      html+=acts.map((a,i)=>`<details class="ac" ${i===0?"open":""}><summary><b>${esc(a.name)}</b> <span class="pill">${esc(a.measure)}</span> <span class="pill">${esc(termLabel(a.term))}</span></summary><div class="inside">${Object.entries(officialText(a)).map(([k,v],j)=>`<label>${esc(k)}</label><div class="copy" id="cp_${a.id}_${j}">${esc(v)}<button class="secondary" onclick="copyText('cp_${a.id}_${j}')">Kopiatu</button></div>`).join("")}</div></details>`).join("");
    }else if(S.summaryMode==="activities"){
      const terms=t==="all"?["1","2","3"]: [t];
      html+=terms.map(tt=>{
        const aa=actsByTerm(tt);
        return `<div class="termBlock"><h3>${TERM_NAMES[tt]}</h3><div class="inside"><table class="tbl"><thead><tr><th>Jarduera</th><th>Neurria</th><th>Orduak</th><th>Arduraduna</th><th>Ekosistema</th><th>Ikasleak</th></tr></thead><tbody>${aa.map(a=>`<tr><td>${esc(a.name)}</td><td>${esc(a.measure)}</td><td>${a.hours}</td><td>${esc(a.teacher)}</td><td>${esc(a.ecosystem||"")}</td><td>${a.students}</td></tr>`).join("")}</tbody></table></div></div>`;
      }).join("");
    }else if(S.summaryMode==="teachers"){
      let map={};S.teachers.forEach(t=>map[t.name]={...t,h:0,acts:[]});
      acts.forEach(a=>{if(!map[a.teacher])map[a.teacher]={name:a.teacher,subject:"",dept:"",load:"",h:0,acts:[]};map[a.teacher].h+=(+a.hours||0);map[a.teacher].acts.push(a.name)});
      html+=`<table class="tbl"><thead><tr><th>Irakaslea</th><th>Ikasgaia</th><th>Mintegia</th><th>Lanaldia</th><th>Orduak/aste</th><th>Jarduerak</th></tr></thead><tbody>${Object.values(map).map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.subject)}</td><td>${esc(x.dept)}</td><td>${esc(x.load)}</td><td>${x.h}</td><td>${esc(x.acts.join(" · "))}</td></tr>`).join("")}</tbody></table>`;

<script id="v40-patch">
(function(){
  const V40_VERSION='4.0';
  const V40_WEEKS={1:10,2:10,3:10};
  const V40_LOADS=['1/3','1/2','2/3','5/6','1'];
  const V40_TIMES=[];
  for(let h=12;h<=20;h++) for(const m of [0,15,30,45]){ if(h===20&&m>0) continue; V40_TIMES.push(String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')); }
  const v40esc=s=>E(s==null?'':String(s));
  const v40num=v=>{const n=Number(String(v??'').replace(',','.'));return Number.isFinite(n)?n:0;};
  const v40Goals=()=>{try{return objs();}catch(e){return []}};
  const v40ActiveInTerm=(a,t)=>a.term==='all'||String(a.term)===String(t);
  const v40TermHours=(a,t)=>{
    if(a.termHours && a.termHours[t]!=null) return v40num(a.termHours[t]);
    if(v40ActiveInTerm(a,t)) return v40num(a.hours)*V40_WEEKS[t];
    return 0;
  };
  const v40AnnualHours=a=>[1,2,3].reduce((s,t)=>s+v40TermHours(a,t),0);
  const v40MeasureWeekly=(measure,t)=> (S.activities||[]).filter(a=>a.measure===measure&&v40ActiveInTerm(a,t)).reduce((s,a)=>s+v40num(a.hours),0);
  const v40ActivitiesTerm=t=>(S.activities||[]).filter(a=>t==='all'||v40ActiveInTerm(a,t));
  const v40UniqueDays=()=>new Set((S.slots||[]).map(s=>s.day).filter(Boolean)).size;
  const v40SlotHours=()=> (S.slots||[]).reduce((sum,s)=>{
    const toMin=x=>{const p=String(x||'').split(':').map(Number);return (p[0]||0)*60+(p[1]||0)};
    return sum+Math.max(0,(toMin(s.end)-toMin(s.start))/60);

  function v40Workbook(filename,sheets){
    const styles=`<Styles>
      <Style ss:ID="Default" ss:Name="Normal"><Alignment ss:Vertical="Center"/><Font ss:FontName="Aptos" ss:Size="10"/></Style>
      <Style ss:ID="title"><Alignment ss:Vertical="Center"/><Font ss:FontName="Aptos Display" ss:Size="18" ss:Bold="1" ss:Color="#355A73"/><Interior ss:Color="#EAF5F5" ss:Pattern="Solid"/></Style>

      <Style ss:ID="sub"><Font ss:Bold="1" ss:Color="#355A73"/><Interior ss:Color="#E7F4F3" ss:Pattern="Solid"/></Style>

      <Style ss:ID="ok"><Font ss:Bold="1" ss:Color="#2F855A"/><Interior ss:Color="#E9F7EF" ss:Pattern="Solid"/></Style>
      <Style ss:ID="warn"><Font ss:Bold="1" ss:Color="#9A6500"/><Interior ss:Color="#FFF5DB" ss:Pattern="Solid"/></Style>
    </Styles>`;
    const cell=(v,style='text')=>`<Cell ss:StyleID="${style}"><Data ss:Type="${typeof v==='number'?'Number':'String'}">${v40Xml(v)}</Data></Cell>`;
    const row=(vals,style)=>`<Row>${vals.map(v=>cell(v,style)).join('')}</Row>`;
    let xml=`<?xml version="1.0" encoding="UTF-8"?><?mso-application progid="Excel.Sheet"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">${styles}`;
    sheets.forEach(sh=>{
      xml+=`<Worksheet ss:Name="${v40Xml(sh.name.slice(0,30))}"><Table>`;
      if(sh.widths)(sh.widths||[]).forEach(w=>xml+=`<Column ss:Width="${w}"/>`);

      (sh.rows||[]).forEach(r=>xml+=row(r));

    });
    xml+='</Workbook>';
    download(filename,xml,'application/vnd.ms-excel;charset=utf-8');

tarea onchange="v40Follow('${a.id}','adjustment',this.value)">${v40esc(f.adjustment||'')}</textarea></div></div></div></details>`;}).join('')||'<div class="card">Ez dago jarduerarik.</div>'}</div>`;

  function v40TeacherRows(term){
    const acts=v40ActivitiesTerm(term);

    }else if(S.summaryMode==='activities'){
      html+=`<div class="summaryAction"><div><b>Jardueren mapa</b><div class="small">Barne-laburpena eta familiei aurkezteko katalogoa.</div></div><button class="primary" onclick="v40DownloadCatalog()">Katalogoa deskargatu</button></div><div class="tableWrap"><table class="tbl"><thead><tr><th>Jarduera</th><th>Neurria</th><th>Asteko orduak</th><th>${t==='all'?'Urteko orduak':'Hiruhilekoko orduak'}</th><th>Arduraduna</th><th>Ekosistema</th><th>Hartzaileak</th></tr></thead><tbody>${acts.map(a=>`<tr><td><b>${v40esc(a.name)}</b></td><td>${v40esc(a.measure)}</td><td>${v40num(a.hours)}</td><td>${t==='all'?v40AnnualHours(a):v40TermHours(a,t)}</td><td>${v40esc(a.teacher)}</td><td>${v40esc(a.ecosystem||'—')}</td><td>${v40esc(a.level||'')} · ${v40num(a.students)}</td></tr>`).join('')}</tbody></table></div>`;

    }else if(S.summaryMode==='followup'){
      html+=`<div class="summaryAction"><div><b>Jarraipen-laburpena</b><div class="small">Excelera eramateko ikuspegi bera.</div></div><button class="primary" onclick="downloadFollowupWorkbook()">Jarraipen Excel deskargatu</button></div><table class="tbl"><thead><tr><th>Jarduera</th><th>Gauzatzea</th><th>Asistentzia</th><th>Balorazioa</th><th>Hurrengo doikuntza</th></tr></thead><tbody>${acts.map(a=>{const f=a.followup||{};return `<tr><td>${v40esc(a.name)}</td><td>${v40num(f.executionPct)}%</td><td>${v40num(f.attendancePct)||v40num(a.att)}%</td><td>${v40esc(f.valuation||'—')}</td><td>${v40esc(f.adjustment||'')}</td></tr>`}).join('')}</tbody></table>`;

      html+=`<div class="checkGrid">${v40Checklist().map(x=>`<div class="checkItem ${x.ok?'done':'todo'}"><span>${x.ok?'✓':'!'}</span><div>${v40esc(x.t)}</div></div>`).join('')}</div>`;

  window.renderHelp=renderHelp;

    const a=S.activities.find(x=>x.id===id);if(!a)return;

<script id="v41-patch">

(function(){

  const goals=()=>{try{return objs();}catch(e){return []}};
  const activeInTerm=(a,t)=>String(a.term)==='all'||String(a.term)===String(t);
  const termHours=(a,t)=> a.termHours&&a.termHours[t]!=null ? num(a.termHours[t]) : (activeInTerm(a,t)?num(a.hours)*WEEKS[t]:0);
  const annualHours=a=>[1,2,3].reduce((s,t)=>s+termHours(a,t),0);
  const actsTerm=t=>(S.activities||[]).filter(a=>t==='all'||activeInTerm(a,t));

  function baseName(n){return String(n||'').replace(/\s*·\s*DBH\s*[1-4](?:\s*[-–]\s*[1-4])?.*$/i,'').trim();}
  const LIB_SOURCE=(typeof DEF!=='undefined'&&Array.isArray(DEF.activities)?DEF.activities:(S.activities||[]));
  const V41_LIBRARY=[]; const seen=new Set();
  LIB_SOURCE.forEach(a=>{const k=(a.measure||'')+'|'+baseName(a.name);if(!baseName(a.name)||seen.has(k))return;seen.add(k);const c=JSON.parse(JSON.stringify(a));c.name=baseName(c.name);V41_LIBRARY.push(c);});

  function indicatorTemplate(i,a){
    const g=goals()[i]||'';
    if(i===0) return 'Jardueraren planifikatutako saioen gutxienez %80 gauzatu dira, eta irakurmena eta/edo matematika lantzeko zereginak jardueraren programazioan esplizituki jasota daude.';
    if(i===1) return 'Jardueraren planifikatutako saioen gutxienez %80 gauzatu dira eta aurreikusitako esperientzia edo azken produktua osatu da.';
    if(i===2) return 'Jardueraren aurreikusitako parte-hartze mailaren gutxienez %70 lortu da eta gutxienez komunikazio-ekintza 1 gauzatu da ikasleekin eta/edo familiekin.';

  const V42_PREFIX='heziV42_center_';

  function isExampleState(st){
    const code=String(st?.center?.code||'');
    const name=String(st?.center?.name||'');
    return code==='999999'||code==='ITS-2026'||/Itsasargi/i.test(name);
  }
  function findCenter(code){
    return (CENTERS||[]).find(c=>String(c.code)===String(code));
  }
  function blankState(c){
    return {
      lang:'eu',
      view:'center',
      summaryMode:'checklist',
      summaryTerm:'all',
      trackTerm:'all',
      center:{
        code:String(c.code||''),
        name:c.name||'',
        municipality:c.municipality||'',
        territory:c.territory||'',
        year:'2026-2027',
        bea:'',
        students:[0,0,0,0],
        indHours:Number(c.ind)||0,
        hobHours:Number(c.hob)||0,
        participants:0
      },
      measures:{ind:'',abe:'',elkar:false,lagun:false},
      slots:[],
      teachers:[],
      priorities:[],
      activities:[],
      _v42:true,
      _v42CenterCode:String(c.code||'')
    };
  }
  function normalizeRealState(st,c){
    st=st&&typeof st==='object'?st:blankState(c);
    st.lang='eu';
    st.view=st.view||'center';
    st.summaryMode=st.summaryMode||'checklist';
    st.center=st.center||{};
    Object.assign(st.center,{
      code:String(c.code||''),
      name:c.name||'',
      municipality:c.municipality||'',
      territory:c.territory||'',
      year:st.center.year||'2026-2027',
      indHours:Number(c.ind)||0,
      hobHours:Number(c.hob)||0
    });
    st.center.bea=st.center.bea||'';
    st.center.students=Array.isArray(st.center.students)?st.center.students.slice(0,4):[0,0,0,0];
    while(st.center.students.length<4)st.center.students.push(0);
    st.center.participants=Number(st.center.participants)||0;
    st.measures=st.measures||{ind:'',abe:'',elkar:false,lagun:false};
    st.slots=Array.isArray(st.slots)?st.slots:[];
    st.teachers=Array.isArray(st.teachers)?st.teachers:[];
    st.priorities=Array.isArray(st.priorities)?st.priorities:[];
    st.activities=Array.isArray(st.activities)?st.activities:[];
    st._v42=true;st._v42CenterCode=String(c.code||'');
    return st;
  }

  const previousSaveSoft=saveSoft;
  saveSoft=function(){
    localStorage.setItem(KEY,JSON.stringify(S));
    if(S?.center?.code && !isExampleState(S)){
      localStorage.setItem(V42_PREFIX+String(S.center.code),JSON.stringify(S));
    }
  };
  window.saveSoft=saveSoft;

  activeMeasures=function(){
    const a=['He-Indartuz','He-Hobetuz'];
    if(S?.measures?.abe==='he-aberastuz')a.push('He-Aberastuz');
    else if(S?.measures?.abe==='bidelaguna')a.push('Bidelaguna');
    if(S?.measures?.elkar)a.push('He-Elkarrekin');
    if(S?.measures?.lagun)a.push('He-Lagun izan');
    return a;
  };
  window.activeMeasures=activeMeasures;

  function loadCenterV42(c){
    if(!c)return;
    if(String(c.code)==='999999'||/Itsasargi/i.test(String(c.name||''))){
      S=clone(V42_SAMPLE);
    }else{
      let st=null;
      try{st=JSON.parse(localStorage.getItem(V42_PREFIX+String(c.code))||'null');}catch(e){st=null;}
      S=st?normalizeRealState(st,c):blankState(c);
    }
    saveSoft();
    render();
  }
  window.loadCenterV42=loadCenterV42;

  function tuneCenterUI(){
    const sel=document.getElementById('centerSelect');
    if(sel){
      sel.value=String(S?.center?.code||'');
      sel.onchange=()=>loadCenterV42(findCenter(sel.value));
    }
    const ind=document.getElementById('mInd');
    if(ind){
      if(!ind.querySelector('option[value=""]'))ind.insertAdjacentHTML('afterbegin','<option value="">— Aukeratu —</option>');
      ind.value=S?.measures?.ind||'';
    }
    const abe=document.getElementById('mAbe');
    if(abe){
      if(!abe.querySelector('option[value=""]'))abe.insertAdjacentHTML('afterbegin','<option value="">— Aukeratu —</option>');
      abe.value=S?.measures?.abe||'';
    }
  }

  const renderV41=render;
  render=function(){
    renderV41();
    tuneCenterUI();
  };
  window.render=render;

  autoIndartuz=function(){
    const h=Number(S?.center?.indHours)||0;
    if(!h){alert('Zentro honek ez du He-Indartuz ordu-esleipenik kargatuta.');return;}
    if(!S?.measures?.ind){alert('Lehenik aukeratu He-Indartuz modalitatea.');return;}
    if(!(S.priorities||[]).length){alert('Lehenik gehitu gutxienez behar edo lehentasun bat.');return;}
    S.activities=(S.activities||[]).filter(a=>a.measure!=='He-Indartuz');
    const g=Math.max(1,Math.floor(h/4));
    const p=S.priorities[0]?.id||'';
    const mode=S.measures.ind==='pendienteak'?'Pendienteak':'Konpetentziala';
    for(let i=1;i<=g;i++){
      const a=newAct('Irakurketa '+i,'He-Indartuz',mode+' · Irakurketa','', 'all',p,S.teachers?.[0]?.name||'',2,0,'','');
      a.termHours={1:20,2:20,3:20};S.activities.push(a);
    }
    for(let i=1;i<=g;i++){
      const a=newAct('Matematika '+i,'He-Indartuz',mode+' · Matematika','', 'all',p,S.teachers?.[1]?.name||'',2,0,'','');
      a.termHours={1:20,2:20,3:20};S.activities.push(a);
    }
    saveSoft();render();
  };
  window.autoIndartuz=autoIndartuz;

  // Hasierako migrazioa: Itsasargi = eredu osoa; zentro erreala = V4.2ko bere datuak edo hutsik.
  if(isExampleState(S)){
    S=clone(V42_SAMPLE);
  }else{
    const c=findCenter(S?.center?.code);
    if(c){
      let st=null;
      try{st=JSON.parse(localStorage.getItem(V42_PREFIX+String(c.code))||'null');}catch(e){st=null;}
      S=st?normalizeRealState(st,c):blankState(c);
    }else{
      S=clone(V42_SAMPLE);
    }
  }
  saveSoft();
  render();
})();
</script>

    }).join('');

  // Jarduera berriek objektu oso bat behar dute; autoIndartuz-ek factory bera erabiltzen du.
  function v49NewActivity(name,measure,sub,eco,term,priority,teacher,hours,students,level,slot){
    return {
      id:uid(),
      name:name||'',
      measure:measure||'He-Indartuz',
      sub:sub||'',
      ecosystem:eco||'',
      term:term||'1',
      priority:priority||'',
      need:'',
      change:'',
      desc:'',
      teacher:teacher||'',
      hours:Number(hours)||0,
      students:Number(students)||0,
      level:level||'',
      groups:[0,0,0,0],
      slot:slot||'',
      slot2:'',
      done:0,
      att:0,
      objectives:[],
      ach:[],
      evidence:'',
      _goalIndicators:{},
      _goalResults:{},
      followup:{executionPct:0,attendancePct:0,valuation:'',evidence:'',notes:'',adjustment:''}
    };
  }
  newAct=v49NewActivity;
  window.newAct=newAct;

  // Wizard-a legacy wrapper katearen menpe egon gabe ireki.
  openWizard=function(id=null,fs=null){
    let src=null;
    if(id){
      src=(S.activities||[]).find(a=>String(a.id)===String(id));
      if(!src){alert('Ezin izan da jarduera aurkitu.');return;}
      D=JSON.parse(JSON.stringify(src));
    }else{
      D=v49NewActivity(
        '',
        (typeof activeMeasures==='function'&&activeMeasures()[0])||'He-Indartuz',
        '', '', '1',
        S.priorities?.[0]?.id||'',
        S.teachers?.[0]?.name||'',
        1,0,'DBH 1',
        S.slots?.[0]?.id||''
      );
    }
    if(typeof window.v44EnsureGoalData==='function')window.v44EnsureGoalData(D);
    step=fs==null?0:Number(fs);
    const m=document.getElementById('modal');
    if(!m)return;
    m.classList.add('open');
    if(typeof drawW==='function')drawW();
  };
  window.openWizard=openWizard;

  // Auto-sorrerak factory konpondua erabiltzen du. Baldintza pedagogikoak mantendu.
  autoIndartuz=function(){
    const h=Number(S?.center?.indHours)||0;
    if(!h){alert('Zentro honek ez du He-Indartuz ordu-esleipenik kargatuta.');return;}
    if(!S?.measures?.ind){alert('Lehenik aukeratu He-Indartuz modalitatea.');return;}
    if(!(S.priorities||[]).length){alert('Lehenik gehitu gutxienez behar edo lehentasun bat.');return;}
    S.activities=(S.activities||[]).filter(a=>a.measure!=='He-Indartuz');
    const g=Math.max(1,Math.floor(h/4));
    const p=S.priorities[0]?.id||'';
    const mode=S.measures.ind==='pendienteak'?'Pendienteak':'Konpetentziala';
    for(let i=1;i<=g;i++){
      const a=v49NewActivity('Irakurketa '+i,'He-Indartuz',mode+' · Irakurketa','', 'all',p,S.teachers?.[0]?.name||'',2,0,'','');
      a.termHours={1:20,2:20,3:20};
      a.objectives=[0,1];
      if(typeof window.v44EnsureGoalData==='function')window.v44EnsureGoalData(a,true);
      S.activities.push(a);
    }
    for(let i=1;i<=g;i++){
      const a=v49NewActivity('Matematika '+i,'He-Indartuz',mode+' · Matematika','', 'all',p,S.teachers?.[1]?.name||'',2,0,'','');
      a.termHours={1:20,2:20,3:20};
      a.objectives=[0,1];
      if(typeof window.v44EnsureGoalData==='function')window.v44EnsureGoalData(a,true);
      S.activities.push(a);
    }
    if(typeof saveSoft==='function')saveSoft();
    if(typeof render==='function')render();
  };
  window.autoIndartuz=autoIndartuz;
})();
</script>

  function balanceSample50(){

    S.teachers=Array.isArray(S.teachers)?S.teachers:[];
    extraTeachers50.forEach(t=>{if(!S.teachers.some(x=>x.name===t.name))S.teachers.push(JSON.parse(JSON.stringify(t)));});
    // Ziurtatu 60 irakasle izatea; lehen 48ak + 12 berriak.

    // Itsasargi ereduan 20 h/aste daude hiruhileko bakoitzean. 20 jarduera x 3H = 60 esleipen.
    // Esleipen bakoitza 1 h/aste x 10 aste = 10 h; irakasle bakoitzak esleipen bakarra jasotzen du.
    hob.slice(0,20).forEach((a,i)=>{

      a.termHours={1:10,2:10,3:10};
      a.termTeachers={1:names[i],2:names[20+i],3:names[40+i]};
      a.teacher=a.termTeachers[1];
    });
    S._v50TenHoursBalanced=true;
    try{saveSoft();}catch(e){}
  }

  window.v50DeleteActivity=function(id){
    const a=(S.activities||[]).find(x=>String(x.id)===String(id));
    if(!a)return;
    if(!confirm('“'+(a.name||'Jarduera')+'” ezabatu nahi duzu? Ekintza hau ezin da desegin.'))return;
    S.activities=(S.activities||[]).filter(x=>String(x.id)!==String(id));
    try{if(typeof D!=='undefined'&&D&&String(D.id)===String(id))D={};}catch(e){}
    try{saveSoft();}catch(e){}
    render();
  };

  // Lehentasunak ere modu esplizituan ezabatzeko aukera. Lotutako jarduerak badaude, ez da ezabatzen.
  window.v40DelPriority=function(i){
    const p=(S.priorities||[])[i];if(!p)return;
    if((S.activities||[]).some(a=>a.priority===p.id)){
      alert('Lehentasun hau jarduera bati lotuta dago. Aldatu edo ezabatu jarduera horren lotura lehenik.');
      return;
    }
    if(!confirm('“'+(p.title||'Lehentasuna')+'” ezabatu nahi duzu?'))return;
    S.priorities.splice(i,1);try{saveSoft();}catch(e){}render();
  };

  const activityCardBefore50=activityCard;
  activityCard=function(a){
    let html=activityCardBefore50(a);
    const marker=`<button class="secondary" onclick="openWizard('${a.id}',4)">${tr().tabs.official}</button>`;
    const del=`<button class="danger v50-delete-btn" onclick="event.preventDefault();event.stopPropagation();v50DeleteActivity('${a.id}')">Ezabatu</button>`;
    if(html.includes(marker))html=html.replace(marker,marker+del);
    else html=html.replace(/<\/div><\/div><\/details>\s*$/,del+'</div></div></details>');
    return html;
  };
  window.activityCard=activityCard;

  function polishDeleteButtons50(){
    document.querySelectorAll('button[onclick^="v40DelPriority("]').forEach(b=>{
      b.textContent='Ezabatu';b.classList.add('v50-priority-delete');b.title='Lehentasuna ezabatu';
    });
    // Irakasle eta ordu-tarteetan lehendik dagoen × botoiari azalpena gehitu.
    document.querySelectorAll('#teachers button.danger,#slots button.danger').forEach(b=>{if(!b.title)b.title='Ezabatu';});
  }

  const renderBefore50=render;
  render=function(){
    balanceSample50();
    renderBefore50();
    polishDeleteButtons50();
    if(S.summaryMode==='teachers'&&isSample50()){
      const c=document.getElementById('summaryContent');
      if(c&&!document.getElementById('v50BalanceNote')){
        c.insertAdjacentHTML('afterbegin','<div id="v50BalanceNote" class="v50-balance-note"><b>Itsasargi ereduko banaketa:</b> 20 h/aste × 10 aste × 3 hiruhileko = 600 h He-Hobetuz. 60 irakasle × 10 h/ikasturte = 600 h. Irakasle bakoitzak hiruhileko bakarrean 1 h/aste egiten du.</div>');
      }
    }
  };
  window.render=render;

  balanceSample50();
  render();
})();
</script>

<script id="v52-multiteacher-multislot-patch">
(function(){
  const V52_VERSION='5.3';
  const V52_WEEKS={1:10,2:10,3:10};
  const V52_ECOS=[
    'Komunitatea eta konpromiso soziala',
    'Partaidetza, ahotsa eta kultura demokratikoa',
    'Ongizatea, zaintza eta bizikidetza',
    'Jasangarritasuna eta ingurunearen zaintza',
    'Berrikuntza guztien onerako',
    'Komunikazioa, kultura eta komunitate-lotura',
    'Euskara eta Euskal Kultura'
  ];
  const esc52=s=>E(s==null?'':String(s));
  const num52=v=>{const n=Number(String(v??'').replace(',','.'));return Number.isFinite(n)?n:0};
  const uniq52=a=>[...new Set((a||[]).map(x=>String(x||'').trim()).filter(Boolean))];
  const activeTerms52=a=>String(a?.term)==='all'?[1,2,3]:[Math.max(1,Math.min(3,Number(a?.term)||1))];
  const termActive52=(a,t)=>activeTerms52(a).includes(Number(t));
  const termHours52=(a,t)=>a?.termHours&&a.termHours[t]!=null?num52(a.termHours[t]):(termActive52(a,t)?num52(a?.hours)*V52_WEEKS[t]:0);

  function slots52(a){
    const ids=Array.isArray(a?.slotIds)?a.slotIds:[];
    return uniq52([...ids,a?.slot,a?.slot2]).filter(id=>(S.slots||[]).some(s=>String(s.id)===String(id)));
  }
  function teachers52(a,t){
    const k=String(t);
    let arr=[];
    if(a?.termTeacherLists&&Array.isArray(a.termTeacherLists[k]))arr=a.termTeacherLists[k];
    else if(a?.termTeachers&&a.termTeachers[k])arr=[a.termTeachers[k]];
    else if(Array.isArray(a?.teachers))arr=a.teachers;
    else if(a?.teacher)arr=[a.teacher];
    return uniq52(arr);
  }
  function allTeachers52(a){return uniq52(activeTerms52(a).flatMap(t=>teachers52(a,t)));}
  function teachersText52(a,t){return teachers52(a,t).join(', ');}
  function allTeachersText52(a){
    const terms=activeTerms52(a), groups=terms.map(t=>teachers52(a,t));
    const flat=uniq52(groups.flat());
    if(terms.length===1)return flat.join(', ');
    const sig=groups.map(x=>x.join('|'));
    if(sig.every(x=>x===sig[0]))return flat.join(', ');
    return terms.map((t,i)=>`${t}H: ${groups[i].join(', ')||'—'}`).join(' · ');
  }
  function slotsText52(a){const ids=slots52(a);return ids.length?ids.map(id=>slotName(id)).filter(Boolean).join(' · '):'Zehazteke';}

  function officialEco52(a){
    const cur=String(a?.ecosystem||'').trim();
    if(!cur)return cur;
    if(V52_ECOS.includes(cur))return cur;
    const text=[a?.name,a?.desc,a?.sub,a?.need,a?.change].join(' ').toLowerCase();
    const exact={
      'Ongizatea eta bizikidetza':'Ongizatea, zaintza eta bizikidetza',
      'Euskara eta euskal kultura':'Euskara eta Euskal Kultura',
      'Jasangarritasuna':'Jasangarritasuna eta ingurunearen zaintza',
      'STEAM eta berrikuntza':'Berrikuntza guztien onerako',
      'Komunikazioa eta sormena':'Komunikazioa, kultura eta komunitate-lotura'
    };
    if(exact[cur])return exact[cur];
    // Bi etiketa zaharrek ez dute baliokidetasun ofizial bakarra. Ez dugu isilean erabakitzen.
    if(cur==='Komunitatea eta parte-hartzea'||cur==='Ikasleen autonomia eta orientazioa')return cur;
    return cur;
  }

  function syncLegacy52(a){
    a.slotIds=slots52(a);
    a.slot=a.slotIds[0]||'';
    a.slot2=a.slotIds[1]||'';
    a.termTeacherLists=a.termTeacherLists||{};
    activeTerms52(a).forEach(t=>{
      const list=uniq52(a.termTeacherLists[String(t)]||teachers52(a,t));
      a.termTeacherLists[String(t)]=list;
    });
    a.teachers=allTeachers52(a);
    const firstTerm=activeTerms52(a)[0];
    a.teacher=teachers52(a,firstTerm)[0]||a.teachers[0]||'';
    a.termTeachers=a.termTeachers||{};
    [1,2,3].forEach(t=>{const l=teachers52(a,t);a.termTeachers[t]=l[0]||'';});
    return a;
  }
  function ensureActivity52(a){
    if(!a)return a;
    if(!Array.isArray(a.slotIds))a.slotIds=uniq52([a.slot,a.slot2]);
    if(!a.termTeacherLists||typeof a.termTeacherLists!=='object'){
      a.termTeacherLists={};
      [1,2,3].forEach(t=>{
        const old=a.termTeachers?.[t]||((String(a.term)==='all'||String(a.term)===String(t))?a.teacher:'');
        a.termTeacherLists[String(t)]=old?[old]:[];
      });
    }else{
      [1,2,3].forEach(t=>{a.termTeacherLists[String(t)]=uniq52(a.termTeacherLists[String(t)]||[])});
    }
    if(a.measure==='He-Hobetuz'){
      a.ecosystem=officialEco52(a);
      if(a.ecosystem&&!V52_ECOS.includes(a.ecosystem))a._v52ReviewEcosystem=a.ecosystem;
      else delete a._v52ReviewEcosystem;
    }
    syncLegacy52(a);
    return a;
  }
  function migrate52(){
    S.teachers=Array.isArray(S.teachers)?S.teachers:[];
    S.slots=Array.isArray(S.slots)?S.slots:[];
    S.activities=Array.isArray(S.activities)?S.activities:[];
    S.activities.forEach(ensureActivity52);
    S._v52=true;
  }
  migrate52();

  // Ekosistema ofizialak bakarrik erakutsi He-Hobetuz jardueretan.
  ecos=function(){return V52_ECOS.slice();};window.ecos=ecos;

  // Irakasle-zerrenda: editatzeak ez du aplikazio osoa berriz renderizatzen.
  // Horrela, details panela ez da ixten eta erabiltzailea ez da atal honetatik "kanporatzen".
  teach=function(i,k,v){
    if(!S.teachers?.[i])return;
    const old=String(S.teachers[i][k]??'');
    S.teachers[i][k]=v;
    if(k==='name'&&old!==v){

  function catalogHtml52(){
    const acts=(S.activities||[]).filter(a=>a.measure!=='He-Indartuz');
    const cards=acts.map(a=>`<article><div class="meta">${esc52(a.measure)}${a.ecosystem?' · '+esc52(a.ecosystem):''}</div><h2>${esc52(a.name)}</h2><p>${esc52(a.desc||'')}</p><div class="facts"><b>Hartzaileak:</b> ${esc52(a.level||'DBH')}<br><b>Ordutegia:</b> ${esc52(slotsText52(a))}</div><div class="goal"><b>Helburua:</b><br>${esc52(a.change||'')}</div></article>`).join('');
    return `<!doctype html><html lang="eu"><head><meta charset="utf-8"><title>Hezi+ jardueren katalogoa</title><style>@page{size:A4;margin:13mm}*{box-sizing:border-box}body{font-family:Arial,sans-serif;margin:0;color:#263238}.hero{padding:22px 24px;border-radius:18px;background:#e9f5f5;margin-bottom:18px}.hero h1{margin:0 0 6px;color:#355a73}.wrap{display:grid;grid-template-columns:1fr 1fr;gap:12px}article{border:1px solid #dfe8ed;border-radius:14px;padding:14px;break-inside:avoid}article h2{font-size:16px;color:#355a73;margin:5px 0 8px}.meta{font-size:10px;font-weight:bold;color:#5d7b8b}.facts,.goal{font-size:11px;margin-top:9px;padding:8px;border-radius:9px;background:#f3f8f9;line-height:1.45}.goal{background:#eef7f3}p{font-size:11px;line-height:1.45;margin:7px 0}@media print{.wrap{grid-template-columns:1fr 1fr}}</style></head><body><div class="hero"><h1>${esc52(S.center?.name||'Hezi+')} · Jardueren katalogoa</h1><div>${esc52(S.center?.year||'2026-2027')} · Familientzat eta ikasleentzat</div></div><div class="wrap">${cards}</div></body></html>`;
  }
  window.v44CatalogPdf=function(){const w=window.open('','_blank');if(!w){alert('Nabigatzaileak leiho berria blokeatu du. Baimendu popup-ak katalogoa PDF gisa gordetzeko.');return;}w.document.open();w.document.write(catalogHtml52());w.document.close();setTimeout(()=>{w.focus();w.print()},350)};
  window.v44CatalogHtml=function(){download('HeziPlus_jardueren_katalogoa.html',catalogHtml52(),'text/html;charset=utf-8')};

  const renderSummaryBefore52=renderSummary;
  renderSummary=function(){
    const mode=S.summaryMode||'checklist';
    if(!['official','activities','teachers'].includes(mode)){
      renderSummaryBefore52();document.querySelector('#summaryContent .v44-backup')?.remove();return;
    }
    summaryH2.textContent='Laburpena';summaryP.textContent='Transferentzia, jarduerak, He-Hobetuz irakasleen dedikazioa eta kontrola.';summaryTabs.innerHTML=summaryTabs52();
    const t=String(S.summaryTerm||'all'),acts=(S.activities||[]).filter(a=>t==='all'||termActive52(a,t));let html='';
    if(mode==='official'){
      html=termBar52('summaryTerm');
      if(t==='all')html+='<div class="callout">Aukeratu hiruhilekoa aplikazio ofizialerako datuak kopiatzeko.</div>';
      else html+=acts.map((a,i)=>`<details class="ac" ${i===0?'open':''}><summary><b>${esc52(a.name)}</b> <span class="pill">${esc52(a.measure)}</span></summary><div class="inside">${Object.entries(officialObject52(a,t)).map(([k,v],j)=>`<label>${esc52(k)}</label><div class="copy" id="cp52_${a.id}_${j}">${esc52(v)}<button class="secondary" onclick="copyText('cp52_${a.id}_${j}')">Kopiatu</button></div>`).join('')}</div></details>`).join('');
    }else if(mode==='activities'){
      html=termBar52('summaryTerm')+`<div class="summaryAction"><div><b>Jardueren laburpena</b><div class="small">Irakasle eta ordu-tarte gehigarriak ere barne.</div></div><div class="v44-summary-actions"><button class="secondary" onclick="v44ActivitiesExcel()">Jardueren Excel</button><button class="primary" onclick="v44CatalogPdf()">Katalogoa PDF / inprimatu</button><button class="secondary" onclick="v44CatalogHtml()">Katalogoa HTML</button></div></div><div class="tableWrap"><table class="tbl"><thead><tr><th>Jarduera</th><th>Neurria</th><th>h/aste</th><th>Arduradunak</th><th>Ordu-tarteak</th><th>Ekosistema</th><th>Hartzaileak</th></tr></thead><tbody>${acts.map(a=>`<tr><td><b>${esc52(a.name)}</b></td><td>${esc52(a.measure)}</td><td>${num52(a.hours)}</td><td>${esc52(t==='all'?allTeachersText52(a):teachersText52(a,t))}</td><td>${esc52(slotsText52(a))}</td><td>${esc52(a.ecosystem||'—')}</td><td>${esc52(a.level||'')}</td></tr>`).join('')}</tbody></table></div>`;
    }else{
      const rows=teacherRows52(),active=rows.filter(r=>r.active>0),over=rows.filter(r=>r.max>1),annual=Math.round(rows.reduce((s,r)=>s+r.annual,0)*100)/100;
      html=`<div class="grid g4"><div class="card metric"><strong>${rows.length}</strong><span>Irakasle guztira</span></div><div class="card metric"><strong>${active.length}</strong><span>He-Hobetuz-en aktibo</span></div><div class="card metric"><strong>${annual} h</strong><span>He-Hobetuz dedikazio osoa</span></div><div class="card metric"><strong>${over.length}</strong><span>&gt;1 h/aste dutenak</span></div></div><div class="v52-summary-note"><b>Kalkulua:</b> jarduera batean bi irakasle badaude, bakoitzari jardueraren dedikazio osoa zenbatzen zaio. Hiruhileko bakoitza 10 astekoa da.</div><div class="summaryAction"><div><b>He-Hobetuz irakasleen dedikazioa</b></div><button class="secondary" onclick="v46TeachersExcel()">Irakasleen Excel</button></div><div class="tableWrap"><table class="tbl"><thead><tr><th>Irakaslea</th><th>Ikasgaia</th><th>Lanaldia</th><th>1H</th><th>2H</th><th>3H</th><th>Urteko guztira</th><th>Egoera</th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>${esc52(r.name)}</b></td><td>${esc52(r.subject||'')}</td><td>${esc52(r.load||'')}</td>${[1,2,3].map(t=>`<td><b>${r.w[t]} h/aste</b><span class="small" style="display:block">${r.total[t]} h / 10 aste</span></td>`).join('')}<td><b>${r.annual} h</b></td><td><span class="pill ${r.status==='Orekatua'?'ok':r.status==='Berrikusi'?'warn':''}">${r.status}</span></td></tr>`).join('')}</tbody></table></div>`;
    }
    summaryContent.innerHTML=html;
  };window.renderSummary=renderSummary;

  // Render bakoitzean datu berriak koherente mantendu, baina erabiltzailearen hautapen anitzak ez gainidatzi.
  const renderBefore52=render;
  render=function(){migrate52();renderBefore52();(S.activities||[]).forEach(syncLegacy52);const td=document.querySelector('#teachers details');if(S.view==='center'&&td)td.open=true;};window.render=render;

  try{saveSoft()}catch(e){}
  render();
})();
</script>
