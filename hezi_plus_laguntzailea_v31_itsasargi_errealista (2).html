<style>
:root{--n:#17365d;--b:#2f75b5;--t:#1f7a8c;--bg:#f5f8fb;--ink:#1f2937;--m:#6b7280;--l:#dbe3ea;--ok:#2f855a;--w:#b7791f;--r:#b23a48;--p:#6f56d9}
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}
.app{display:grid;grid-template-columns:258px 1fr;min-height:100vh}aside{background:linear-gradient(180deg,var(--n),#102943);color:white;padding:24px 18px;position:sticky;top:0;height:100vh}
.brand{font-size:25px;font-weight:800}.brand small{font-size:12px;font-weight:500;opacity:.75}.sideTop{display:flex;justify-content:space-between;gap:8px;align-items:start}.lang{display:flex;gap:5px}.lang button{border:1px solid #ffffff44;background:#ffffff12;color:#fff;border-radius:999px;font-weight:800;font-size:11px;padding:5px 7px}.lang button.active{background:#fff;color:var(--n)}
.nav{display:grid;gap:8px;margin-top:25px}.nav button{border:0;background:transparent;color:#dce7f2;padding:12px;border-radius:11px;text-align:left;font-weight:700}.nav button.active,.nav button:hover{background:#ffffff1c;color:white}
aside .logic{position:absolute;bottom:20px;left:18px;right:18px;padding:12px;background:#ffffff12;border-radius:12px;font-size:12px;line-height:1.45}.ej{font-size:12px;color:#dce7f2;margin-top:12px;font-weight:800}.officialLogo{width:100%;max-width:214px;margin-top:13px;border-radius:8px;background:#000;display:block}.creditSmall{display:block;margin-top:9px;font-size:10px;line-height:1.3;color:#dce7f2;opacity:.86}.lang{display:none!important}
main{padding:28px 32px 50px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:24px}.top h1{margin:0;color:var(--n)}.top p{margin:5px 0;color:var(--m)}
.view{display:none}.view.active{display:block}.grid{display:grid;gap:16px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
.card{background:white;border:1px solid var(--l);border-radius:17px;padding:19px;box-shadow:0 10px 28px #17365d12}.metric strong{display:block;font-size:29px;color:var(--n)}.metric span{color:var(--m);font-size:13px}
.sec{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:26px 0 11px}.sec h2{margin:0;color:var(--n);font-size:20px}.sec p{margin:3px 0 0;color:var(--m);font-size:13px}
.primary,.secondary,.danger{border-radius:11px;padding:10px 13px;font-weight:750}.primary{border:0;background:var(--b);color:white}.secondary{border:1px solid var(--l);background:white;color:var(--n)}.danger{border:1px solid #ffd0d5;background:#fff2f3;color:var(--r)}
.pill{display:inline-flex;border-radius:999px;padding:5px 8px;font-size:11px;font-weight:800;background:#eaf2f8;color:var(--b);margin:2px}.warn{background:#fff5db;color:var(--w)}.ok{background:#e9f7ef;color:var(--ok)}.bad{background:#fff1f2;color:var(--r)}.teal{background:#e8f7f9;color:var(--t)}.purple{background:#f1edff;color:var(--p)}.orange{background:#fff4df;color:var(--w)}
.priority{border-left:5px solid var(--t)}.activity{border-left:5px solid var(--b)}.activity.ind{border-left-color:var(--t)}.activity.hob{border-left-color:var(--b)}.activity.bide{border-left-color:var(--p)}.activity.abe{border-left-color:var(--w)}.activity h3,.priority h3{color:var(--n);margin:6px 0}.small{font-size:12px;color:var(--m)}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
.progress{height:8px;background:#edf1f5;border-radius:999px;overflow:hidden}.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--t),var(--b))}
label{display:block;color:var(--n);font-size:13px;font-weight:750;margin:12px 0 5px}input,select,textarea{width:100%;border:1px solid #ccd7e1;border-radius:10px;padding:10px;background:white}textarea{min-height:88px;resize:vertical}
.form2{display:grid;grid-template-columns:1fr 1fr;gap:13px}.form3{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.form4{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.full{grid-column:1/-1}.callout{background:#eaf5f7;border:1px solid #cfe6ea;color:#245d66;padding:13px;border-radius:12px}.coh{display:grid;gap:8px}.coh div{display:flex;justify-content:space-between;padding:10px 12px;border:1px solid var(--l);background:#f8fafb;border-radius:10px}.tbl{width:100%;border-collapse:collapse;background:white}.tbl th,.tbl td{border-bottom:1px solid var(--l);padding:9px;text-align:left;vertical-align:top;font-size:13px}.tbl th{color:var(--n);background:#f7f9fb}.tbl input,.tbl select{padding:8px}
.modal{position:fixed;inset:0;background:#11182780;display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal.open{display:flex}.box{background:white;width:min(1030px,100%);max-height:92vh;overflow:auto;border-radius:18px}.mhead{position:sticky;top:0;background:white;padding:16px 20px;border-bottom:1px solid var(--l);display:flex;justify-content:space-between;z-index:2}.mbody{padding:20px}.steps{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:17px}.step{padding:7px 9px;border-radius:999px;background:#edf1f5;color:var(--m);font-size:11px;font-weight:800}.step.active{background:var(--n);color:white}
.actions{display:flex;justify-content:space-between;gap:10px;margin-top:18px}.copy{position:relative;white-space:pre-wrap;background:#f7f9fb;border:1px solid var(--l);border-radius:11px;padding:13px 90px 13px 13px;min-height:52px}.copy button{position:absolute;right:8px;top:8px}
.timeline{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.timeline div{text-align:center;background:#eaf2f8;color:var(--n);padding:9px;border-radius:9px;font-size:11px;font-weight:800}
.schedule{overflow:auto}.schedule table{min-width:900px}.slotCard{cursor:pointer;border-left:5px solid var(--b);background:#f7f9fb;border-radius:10px;padding:7px 8px;margin:5px 0;font-size:12px}.slotCard:hover{filter:brightness(.98);transform:translateY(-1px)}.slotCard.ind{border-left-color:var(--t);background:#e8f7f9}.slotCard.bide{border-left-color:var(--p);background:#f1edff}.slotCard.abe{border-left-color:var(--w);background:#fff4df}
details.ac{background:white;border:1px solid var(--l);border-radius:17px;box-shadow:0 10px 28px #17365d12;overflow:hidden}details.ac summary{list-style:none;cursor:pointer;padding:16px 18px}details.ac summary::-webkit-details-marker{display:none}.inside{border-top:1px solid var(--l);padding:16px 18px;background:#fbfdff}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.tabs button.active{background:var(--n);color:white}.guideSteps{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.guideSteps div{border:1px solid var(--l);background:#f8fafb;border-radius:12px;padding:13px}.guideSteps b{color:var(--n)}
@media(max-width:950px){.app{grid-template-columns:1fr}aside{height:auto;position:relative}.logic{position:static!important;margin-top:14px}.nav{grid-template-columns:repeat(3,1fr)}.g4,.g3,.form4,.form3{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){main{padding:20px 14px}.g4,.g3,.g2,.form2,.form3,.form4,.timeline,.guideSteps{grid-template-columns:1fr}.nav{grid-template-columns:1fr 1fr}.actions{display:grid}.copy{padding-right:13px}.copy button{position:static;margin-top:8px}}@media print{aside,.top .row,.nav,.actions,.tabs,.secondary,.primary,.danger{display:none!important}.app{display:block}main{padding:0}.card,details.ac{box-shadow:none;break-inside:avoid}.view{display:block!important}}

    if(imported.length)S.activities=[...S.activities.filter(a=>a.measure==='He-Indartuz'),...imported,...S.activities.filter(a=>a.measure!=='He-Indartuz'&&a.measure!=='He-Hobetuz')];

  function insertImportBox(){const call=document.getElementById('centerCall');if(!call||document.getElementById('oldImportBox'))return;call.insertAdjacentHTML('afterend',`<div class="card importBox" id="oldImportBox" style="box-shadow:none"><div class="row between"><div><strong>Aurreko kalkulagailuko datuak aprobetxatu</strong><div class="small">Ikastetxeak lehen kalkulagailuan egindakoa ekarri daiteke: zentroa, orduak, ordu-tarteak, irakasleak eta He-Hobetuz ikastaroak.</div></div><div class="row"><button class="secondary" onclick="importOldCalcLocal()">Nabigatzaile honetatik ekarri</button><label class="secondary" style="margin:0">JSON/TXT kargatu<input type="file" accept=".json,.txt,application/json,text/plain" style="display:none" onchange="importOldCalcFile(this)"></label></div></div></div>`)}
  const baseRenderCenter=renderCenter; renderCenter=function(){baseRenderCenter();insertImportBox();}; window.renderCenter=renderCenter;
  const baseRenderHelp=renderHelp;
  renderHelp=function(){baseRenderHelp(); helpContent.insertAdjacentHTML('beforeend',`<div class="card"><h2 style="color:var(--n);margin-top:0">Aurreko kalkulagailutik ekartzea</h2><p>Ikastetxeak aurreko kalkulagailuan egindakoa aprobetxatzeko bi aukera daude:</p><div class="guideSteps"><div><b>Nabigatzaile berean</b><br>“Nabigatzaile honetatik ekarri” botoiak aurreko localStorage gakoa bilatzen du.</div><div><b>Fitxategi bidez</b><br>Aurreko kalkulagailutik deskargatutako JSON/TXT datua kargatu daiteke.</div></div></div>`)}; window.renderHelp=renderHelp;

<script id="v30-schedule-indicators-script">
(function(){
  const PCTS=[75,70,80];
  function goals(){try{return objs()}catch(e){return []}}
  function clean(s){return String(s||'').replace(/\s+/g,' ').replace(/\.$/,'').trim()}
  function priorityOf(a){return (S.priorities||[]).find(p=>p.id===a.priority)||{};}
  function inferObjectives(a){
    if(Array.isArray(a.objectives)&&a.objectives.length) return a.objectives.slice(0,3);
    const p=(priorityOf(a).title+' '+a.name+' '+a.need+' '+a.change+' '+a.measure).toLowerCase();
    if(p.includes('irakur')||p.includes('matemat')||p.includes('konpetentzia')) return [0,3,4];
    if(p.includes('famil')||p.includes('parte')||p.includes('pertenentzia')) return [2,1,4];
    if(p.includes('euskara')) return [1,2,4];
    if(p.includes('bizikidetza')||p.includes('zaintza')||p.includes('kooperat')) return [2,3,4];
    if(p.includes('aberastuz')||p.includes('bidelaguna')) return [1,2,3];
    return [0,1,2];
  }
  function measurableObject(a){
    const p=priorityOf(a);
    const change=clean(a.change)||clean(p.change)||'hautatutako lehentasunean aurrerapena egitea';
    const need=clean(a.need)||clean(p.title)||'identifikatutako beharra';
    if(change.length>115) return change.slice(0,112)+'...';
    return change;
  }
  function actionByGoal(goal,a,idx){
    const g=String(goal||'').toLowerCase();
    const change=measurableObject(a).toLowerCase();
    const product=(a.measure==='He-Indartuz')?'azken ataza konpetentziala':'jardueraren azken produktu edo jarduna';
    if(g.includes('oinarrizko konpetentziak')) return `landutako konpetentzian aurrerapena erakusten du: ${change}`;
    if(g.includes('hezkuntza-eskaintza')) return `${product} osatzen du eta ikasitakoa egoera esanguratsu batean aplikatzen du`;
    if(g.includes('parte-hartzea')||g.includes('familien')) return `parte-hartze aktiboa erakusten du eta ikastetxearekiko loturari lotutako ekarpen bat egiten du`;
    if(g.includes('arrakalak')) return `hasierako egoerarekiko aurrerapena erakusten du, identifikatutako beharrari erantzunez`;
    if(g.includes('berrikuntza')) return `metodologia aktibo baten bidez ${product} hobetua sortzen edo berrikusten du`;
    if(g.includes('lankidetza')) return `talde-lanean edo ikaskuntza partekatuan ekarpen argia eta erabilgarria egiten du`;
    return idx===0?change:idx===1?`${product} osatzen du`:`ikasitakoa testuinguru berri edo partekatu batean aplikatzen du`;
  }
  function buildThreeIndicators(a){
    if(!a.objectives||!a.objectives.length) a.objectives=inferObjectives(a);
    a.objectives=a.objectives.slice(0,3);
    const g=goals();
    let selected=a.objectives.map(i=>g[i]).filter(Boolean);
    while(selected.length<3){
      const fallback=g[[0,1,2,3,4,5][selected.length]]||measurableObject(a);
      if(!selected.includes(fallback)) selected.push(fallback); else selected.push(measurableObject(a));
    }
    const level=clean(a.level)||'parte-hartzaileak';
    const timeframe=a.term==='all'?'ikasturtearen amaieran':`${termLabel(a.term)}ren amaieran`;
    a.ach=selected.slice(0,3).map((goal,idx)=>{
      const pct=PCTS[idx];
      const action=actionByGoal(goal,a,idx);
      const measure=idx===0?'adostutako errubrika edo proba laburraren arabera':idx===1?'ikasleen produktu/jardunaren balorazioaren arabera':'irakaslearen behaketa-erregistro edo autoebaluazio laburraren arabera';
      return `${timeframe}, ${level} taldeko parte-hartzaileen %${pct}ek ${action}, ${measure}.`;
    });
    if(a.follow) delete a.follow;
    return a;
  }
  window.buildThreeIndicators=buildThreeIndicators;
  function ensureThreeAll(force=false){
    (S.activities||[]).forEach(a=>{
      if(!a.objectives||!a.objectives.length) a.objectives=inferObjectives(a);
      const count=(a.ach||[]).filter(Boolean).length;
      if(force || count!==3 || (a.ach||[]).some(x=>String(x).includes('sortu edo egokitu'))) buildThreeIndicators(a);
      a.ach=(a.ach||[]).filter(Boolean).slice(0,3);
      if(a.follow) delete a.follow;
    });
  }
  function typeClass2(m){if(m==='He-Indartuz')return'ind';if(m==='He-Hobetuz')return'hob';if(m==='Bidelaguna')return'bide';if(m==='He-Aberastuz')return'abe';if(m==='He-Elkarrekin')return'elkar';if(m==='He-Lagun izan')return'lagun';return'';}
  function dayList(){return ['Astelehena','Asteartea','Asteazkena','Osteguna','Ostirala'];}
  function ranges(){
    const map=new Map();
    (S.slots||[]).forEach(s=>{const k=(s.start||'')+'|'+(s.end||'');if(!map.has(k))map.set(k,{start:s.start,end:s.end});});
    return [...map.values()].sort((a,b)=>(a.start||'').localeCompare(b.start||'')||(a.end||'').localeCompare(b.end||''));
  }
  function actsFor(day,start,end){
    const ids=(S.slots||[]).filter(s=>s.day===day&&s.start===start&&s.end===end).map(s=>s.id);
    return (S.activities||[]).filter(a=>ids.includes(a.slot)||ids.includes(a.slot2));
  }
  renderSchedule=function(){
    scheduleH2.textContent='Ordutegia';
    scheduleP.textContent='Ordu-tarteka antolatuta: tarte bakoitzean egun bakoitzeko saio guztiak pilatuta agertzen dira. Saioak ez dira zertan errenkada berean edo bakarka agertu; tarte berean hainbat jarduera egon daitezke.';
    printBtn.textContent='Inprimatu';
    const rs=ranges();
    const total=(S.activities||[]).length;
    const legend=`<div class="scheduleLegend"><span class="pill teal">He-Indartuz</span><span class="pill">He-Hobetuz</span><span class="pill purple">Bidelaguna</span><span class="pill orange">He-Aberastuz</span><span class="pill ok">He-Elkarrekin</span><span class="pill bad">He-Lagun izan</span></div>`;
    if(!rs.length){scheduleGrid.innerHTML='<div class="empty">Ez dago ordu-tarterik definituta.</div>';return;}
    scheduleGrid.innerHTML=`<div class="scheduleHint"><strong>Ikuspegi berria:</strong> lehenengo ordu-tartea, gero egunak. Egun bakoitzean jarduera guztiak txartel moduan agertzen dira eta klik eginda fitxa zabaltzen da.</div>${legend}<div class="visualSchedule">${rs.map(r=>{
      const count=dayList().reduce((sum,d)=>sum+actsFor(d,r.start,r.end).length,0);
      return `<section class="timeBand"><div class="timeBandHead"><div><div class="time">${E(r.start)} – ${E(r.end)}</div><div class="small">Ordu-tarte honetan kokatutako saioak</div></div><div class="count">${count} saio · ${total} jarduera guztira</div></div><div class="dayStrip">${dayList().map(day=>{
        const acts=actsFor(day,r.start,r.end);
        return `<div class="dayCell ${acts.length?'hasEvents':''}"><div class="dayName">${day}</div>${acts.length?acts.map(a=>`<div class="session ${typeClass2(a.measure)}" onclick="openInfo('${a.id}')"><div class="sessionTitle">${E(a.name)}</div><div class="sessionMeta"><strong>${E(a.measure)}</strong> · ${E(termLabel(a.term))}<br>${E(a.teacher||'Arduraduna zehaztu gabe')} · ${E(a.level||'DBH')} · ${E(a.students||0)} ik.${a.ecosystem?`<br><span class="pill teal">${E(a.ecosystem)}</span>`:''}</div></div>`).join(''):'<div class="emptySlot">Tarte honetan ez dago saiorik.</div>'}</div>`;
      }).join('')}</div></section>`;
    }).join('')}</div>`;
  };
  window.renderSchedule=renderSchedule;
  // Lorpen-adierazleak: botoia eta wizard-a berridatzi, beti 3 sortzeko.
  suggestIndicators=function(){try{cap()}catch(e){} buildThreeIndicators(D); drawW();};
  window.suggestIndicators=suggestIndicators;
  const oldOpenWizard=openWizard;
  openWizard=function(id=null,fs=null){oldOpenWizard(id,fs); if(D){ if(!D.objectives||!D.objectives.length)D.objectives=inferObjectives(D); if((D.ach||[]).filter(Boolean).length!==3) buildThreeIndicators(D); drawW(); }};
  window.openWizard=openWizard;
  const oldNewAct=newAct;
  newAct=function(name,measure,sub,eco,term,priority,teacher,hours,students,level,slot){const a=oldNewAct(name,measure,sub,eco,term,priority,teacher,hours,students,level,slot);buildThreeIndicators(a);return a;};
  window.newAct=newAct;
  body=function(s){
    if(!D.objectives||!D.objectives.length)D.objectives=inferObjectives(D); if(!D.ach)D.ach=[];
    if(s===0)return `<div class="callout">Lehenik identifikatu beharra eta lehentasuna; ondoren lotu jarduera ebazpeneko helburu espezifikoekin.</div><div class="form2"><div><label>Lehentasuna</label><select id="wPriority">${priorityOptions(D.priority)}</select></div><div><label>Neurria</label><select id="wMeasure" onchange="D.measure=this.value;drawW()">${measureOptions(D.measure)}</select></div><div><label>Hiruhilekoa</label><select id="wTerm">${['1','2','3','all'].map(x=>`<option value="${x}" ${D.term==x?'selected':''}>${termLabel(x)}</option>`).join('')}</select></div>${D.measure==='He-Hobetuz'?`<div><label>Ekosistema</label><select id="wEco"><option value="">He-Hobetuz jardueretan ekosistema aukeratu.</option>${ecos().map(e=>`<option ${D.ecosystem===e?'selected':''}>${E(e)}</option>`).join('')}</select></div>`:''}<div class="full"><label>Identifikatutako beharra</label><textarea id="wNeed">${E(D.need)}</textarea></div><div class="full"><label>Lehentasunarekin lotutako espero den aldaketa</label><textarea id="wChange">${E(D.change)}</textarea></div></div>`;
    if(s===1)return `<div class="form2"><div><label>Jardueraren izena</label><input id="wName" value="${E(D.name)}"></div><div><label>Azpitipologia</label><input id="wSub" value="${E(D.sub)}"></div><div class="full"><label>Jardueraren deskribapen laburra</label><textarea id="wDesc">${E(D.desc)}</textarea></div><div><label>Arduraduna</label><select id="wTeacher">${teacherOptions(D.teacher)}</select></div><div><label>Maila</label><input id="wLevel" value="${E(D.level)}"></div><div><label>Planifikatutako orduak</label><input id="wHours" type="number" value="${D.hours}"></div><div><label>Ikasle kopurua</label><input id="wStudents" type="number" value="${D.students}"></div><div><label>Ordu-tartea 1</label><select id="wSlot">${S.slots.map(s=>`<option value="${s.id}" ${D.slot===s.id?'selected':''}>${slotName(s.id)}</option>`).join('')}</select></div><div><label>Ordu-tartea 2</label><select id="wSlot2"><option value="">—</option>${S.slots.map(s=>`<option value="${s.id}" ${D.slot2===s.id?'selected':''}>${slotName(s.id)}</option>`).join('')}</select></div></div>`;
    if(s===2){
      const gg=goals();
      return `<div class="callout"><b>Lorpen-adierazleak bakarrik.</b> Hautatu gehienez 3 helburu espezifiko. Aplikazioak <b>3 lorpen-adierazle</b> sortuko ditu beti: neurgarriak, lehentasunarekin lotuak eta helburuekin lerrokatuak.</div><div class="indicatorQuality"><strong>Irizpidea:</strong> adierazle bakoitzak nork, zer lortuko duen, zenbateko portzentajea eta noiz neurtuko den jasotzen du.</div><div class="grid g2" style="margin-top:12px"><div class="card" style="box-shadow:none"><span class="pill">Ebazpeneko helburu espezifikoak</span><div style="margin-top:10px">${gg.map((g,i)=>`<label class="checkBox" style="display:block;margin:6px 0;color:var(--ink);font-weight:500"><input type="checkbox" data-goal="${i}" ${D.objectives?.includes(i)?'checked':''} style="width:auto;margin-right:7px"> ${E(g)}</label>`).join('')}</div></div><div class="card" style="box-shadow:none"><span class="pill ok">3 lorpen-adierazle</span><div class="row" style="margin-top:8px"><button class="secondary" onclick="suggestIndicators()">3 adierazle automatikoki sortu</button></div>${[0,1,2].map(i=>`<label>Lorpen-adierazlea ${i+1}</label><textarea id="wAch${i}" placeholder="Aplikazioak beteko du">${E(D.ach?.[i]||'')}</textarea>`).join('')}<div class="indicatorMap"><div><b>L1</b> · lehentasunaren hobekuntza nagusia</div><div><b>L2</b> · hautatutako helburu espezifikoaren aplikazioa</div><div><b>L3</b> · ikasitakoaren transferentzia edo azken produktua</div></div></div></div>`;
    }
    if(s===3){const ach=(D.ach||[]).filter(Boolean).length;const c=[['Beharra identifikatuta',D.need],['Lehentasuna hautatuta',D.priority],['Neurria hautatuta',D.measure],['Hiruhilekoa',D.term],['Helburu espezifikoak hautatuta',(D.objectives||[]).length>0],['He-Hobetuz ekosistema',D.measure!=='He-Hobetuz'||D.ecosystem],['Jarduera zehaztuta',D.desc],['3 lorpen-adierazle sortuta',ach===3]];return `<div class="callout"><b>${c.filter(x=>x[1]).length}/${c.length}</b> elementu osatuta. Adierazleak berrsortzeko itzuli aurreko pausora eta sakatu “3 adierazle automatikoki sortu”.</div><div class="coh" style="margin-top:12px">${c.map(x=>`<div><span>${x[0]}</span><b style="color:${x[1]?'var(--ok)':'var(--r)'}">${x[1]?'✓':'!'}</b></div>`).join('')}</div>`}
    if(s===4)return `<div class="officialNote"><strong>Aplikazio ofizialerako kopiatzeko eremuak.</strong> Lorpen-adierazleak 3 dira eta jardueraren lehentasun/helburuekin lerrokatuta sortu dira.</div>`+Object.entries(officialText(D)).map(([k,v],i)=>`<label>${E(k)}</label><div class="copy" id="cpw${i}">${E(v)}<button class="secondary" onclick="copyText('cpw${i}')">Kopiatu</button></div>`).join('');
  };
  window.body=body;
  cap=function(){const x=id=>document.getElementById(id);if(step===0){D.priority=x('wPriority').value;D.measure=x('wMeasure').value;D.term=x('wTerm').value;if(D.measure==='He-Hobetuz')D.ecosystem=x('wEco').value;else D.ecosystem='';D.need=x('wNeed').value;D.change=x('wChange').value;}if(step===1){D.name=x('wName').value;D.sub=x('wSub').value;D.desc=x('wDesc').value;D.teacher=x('wTeacher').value;D.level=x('wLevel').value;D.hours=+x('wHours').value;D.students=+x('wStudents').value;D.slot=x('wSlot').value;D.slot2=x('wSlot2').value;}if(step===2){D.objectives=[...document.querySelectorAll('[data-goal]:checked')].map(el=>+el.dataset.goal).slice(0,3);D.ach=[0,1,2].map(i=>x('wAch'+i).value.trim()).filter(Boolean).slice(0,3);if(D.ach.length!==3)buildThreeIndicators(D);if(D.evidence)D.evidence='';}};
  window.cap=cap;
  const oldChecklist=checklist;
  checklist=function(){const rows=oldChecklist().filter(r=>!r.t.includes('adierazle')&&!r.t.includes('indicadores'));rows.push({t:'Jarduera guztiek helburu espezifikoak hautatuta dituzte',ok:S.activities.every(a=>(a.objectives||[]).length>0)});rows.push({t:'Jarduera guztiek zehazki 3 lorpen-adierazle dituzte',ok:S.activities.every(a=>(a.ach||[]).filter(Boolean).length===3)});rows.push({t:'Lorpen-adierazleak lehentasunekin eta helburuekin lerrokatuta berrikusita daude',ok:S.activities.every(a=>(a.objectives||[]).length>0&&(a.ach||[]).filter(Boolean).length===3)});return rows;};
  window.checklist=checklist;

<script id="v31-realistic-example">
(function(){
  function plannedHours(measures){
    return (S.activities||[]).filter(a=>measures.includes(a.measure)).reduce((x,a)=>x+(+a.hours||0),0);
  }
  window.heziHours=function(){
    const indAssigned=+S.center.indHours||0, hobAssigned=+S.center.hobHours||0;
    const indActual=plannedHours(["He-Indartuz"]);
    const hobActual=plannedHours(["He-Hobetuz"]);
    const abe=plannedHours(["He-Aberastuz","Bidelaguna"]);
    const opt=plannedHours(["He-Elkarrekin","He-Lagun izan"]);
    const totalActual=indActual+hobActual+abe+opt;
    return {ind:indAssigned,hob:hobAssigned,indActual,hobActual,abe,opt,total:totalActual,assignedTotal:indAssigned+hobAssigned+abe+opt};
  };
  function drawV31Hours(){
    const box=document.getElementById("hoursBox");
    if(!box) return;
    const h=heziHours();
    box.innerHTML=`<div class="sec" style="margin:0 0 11px">
      <div><h2 style="margin:0;color:var(--n);font-size:20px">Hezi+ asteko ordu-eskaintza</h2>
      <p class="small">Esleitutako orduak editagarriak dira; planifikatutako orduak jardueretatik kalkulatzen dira.</p></div>
    </div>
    <div class="hoursGrid">
      <div class="hourMini"><label>He-Indartuz · esleituta</label><input type="number" min="0" step="0.5" value="${h.ind}" onchange="updateAssignedHours('indHours',this.value)"><small>Planifikatuta: <b>${h.indActual} h</b></small></div>
      <div class="hourMini"><label>He-Hobetuz · esleituta</label><input type="number" min="0" step="0.5" value="${h.hob}" onchange="updateAssignedHours('hobHours',this.value)"><small>Planifikatuta: <b>${h.hobActual} h</b></small></div>
      <div class="hourMini auto"><span class="small">He-Aberastuz / Bidelaguna</span><strong>${h.abe} h</strong><small>jardueretatik kalkulatua</small></div>
      <div class="hourMini auto"><span class="small">Hautazko neurriak</span><strong>${h.opt} h</strong><small>He-Elkarrekin + He-Lagun izan</small></div>
      <div class="hourMini total"><span class="small">Guztira planifikatuta</span><strong>${h.total} h/aste</strong><small>jarduera guztien batura</small></div>
    </div>
    <div class="hoursNote">Itsasargi adibidean He-Hobetuz jarduerek <strong>${h.hobActual}/${h.hob} h/aste</strong> betetzen dituzte. Jarduera batzuk maila desberdinetarako bikoiztuta daude, eskaintza errealistagoa izateko.</div>`;
  }
  const _renderCenter31=renderCenter;
  renderCenter=function(){_renderCenter31();drawV31Hours();};
  window.renderCenter=renderCenter;

  const _checklist31=checklist;
  checklist=function(){
    const rows=_checklist31();
    const h=heziHours();
    rows.push({t:`He-Hobetuz jarduerak esleitutako orduetara iristen dira (${h.hobActual}/${h.hob} h/aste)`,ok:h.hobActual>=h.hob});
    rows.push({t:`Irakasle-zerrenda osoa kargatuta dago (${(S.teachers||[]).length}/48)`,ok:(S.teachers||[]).length>=48});
    rows.push({t:`Hezi+ asteko eskaintza osoa kalkulatuta dago (${h.total} h/aste planifikatuta)`,ok:h.total>0});
    return rows;
  };
  window.checklist=checklist;

  render();
})();
</script>
